/* ===== 화면 구성용 추가 스타일 (키트 코드 아래에 덧붙임) ===== */

<script>
/* ============ 계산 로직 (CALC-START) ============ */
const BIG=['JPY','VND','IDR','KHR','LAK','MMK','MNT','KZT','COP','CLP','TZS'];            // 100단위당 환율로 보여줄 통화
const CATS=['항공','숙박','식비','교통','쇼핑','입장료','기타'];
const CURS=['USD','JPY','EUR','CNY','THB','VND','TWD','HKD','SGD','GBP','AUD'];
const CNAME={USD:'미국',JPY:'일본',EUR:'유럽',CNY:'중국',THB:'태국',VND:'베트남',TWD:'대만',HKD:'홍콩',SGD:'싱가포르',GBP:'영국',AUD:'호주'};
const PAYN={cash:'현금',tlog:'카드(트래블로그)',twallet:'카드(트래블월렛)',atm:'ATM기',other:'Other Payer',krw:'원화',card:'카드'};
const OSN={later:'나중에 정산',mine:'내 외화로 지급',done:'정산 끝'};   // Other Payer 정산 방식
const isWd=x=>x.pay=='atm';   // ATM 인출 = 지출이 아니라 "현금 만들기" → 총 지출·분류·정산에서 제외
const inBudget=x=>!isWd(x)&&!(x.pay=='other'&&x.os=='done');   // 총 지출·분류·정산에 넣을 지출 (ATM 인출, 정산 끝은 제외)
const isDutch=x=>x.pay!='atm'&&!(x.pay=='other'&&x.os=='done')&&!!(x.pay=='other'||x.custom||(x.split||[]).length>1||(x.payer&&x.payer!='나'));   // 목록에 결제한 사람을 보여줄 더치페이 지출
function meFrac(x){if(x.custom){const s=Object.values(x.custom).reduce((a,b)=>a+ +b,0);return s?(x.custom['나']||0)/s:0}const sp=x.split||[];return sp.includes('나')?1/sp.length:0}   // 내 몫 비율
function avgRate(t,c){let k=0,f=0;t.exchanges.forEach(e=>{if(e.cur==c){k+=+e.krw;f+=+e.fx}});return f?k/f:0}
/* ★ 환율 자동 적용 (여행마다 t.rateMode: 'fifo'=환전 순서대로 / 'avg'=평균 환율)
   · 카드(트래블로그·월렛)·ATM 인출 → "환전한 외화"에서 순서대로 차감, 그 환전분의 환율 적용 (두 환전에 걸치면 구간별로 계산해 합산)
   · ATM으로 뽑은 금액은 "현금 주머니"가 되고, 현금 지출은 이 주머니에서 순서대로 차감, 인출 때의 환율 적용
   · 환율 직접 입력 지출도 순서(차감)에는 똑같이 포함 / 원화 지출은 그대로 */
const sortKey=e=>String(e.date)+' '+(e.time||(e.pay=='atm'?'00:00':'99:99'));   // 시간 없으면 그날 맨 뒤 (단, ATM 인출은 그날 맨 앞)
function calcAll(t){
 const avg=t.rateMode=='avg',by={},lots={},wd={},last={},cmp=(a,b)=>sortKey(a[0]).localeCompare(sortKey(b[0]))||a[1]-b[1];
 t.exchanges.map((e,i)=>[e,i]).sort(cmp).forEach(([e])=>{(lots[e.cur]=lots[e.cur]||[]).push({left:+e.fx,rate:e.krw/e.fx})});
 const take=(pool,c,amt,key)=>{const L=pool[c]||[];let need=amt,krw=0;while(need>1e-9&&L.length){const l=L[0],u=Math.min(l.left,need);krw+=u*l.rate;l.left-=u;need-=u;last[key]=l.rate;if(l.left<=1e-9)L.shift()}return{krw,over:need>1e-9?need:0}};
 t.expenses.map((x,i)=>[x,i]).sort(cmp).forEach(([x])=>{
  const amt=+x.amt,c=x.cur,r={krw:0,rate:0,over:0,manual:false};by[x.id]=r;
  if(x.pay=='krw'||c=='KRW'){r.krw=amt;return}
  if(x.pay=='card'){r.krw=+x.krw||0;r.rate=amt?r.krw/amt:0;return}
  if(x.pay=='other'){const mine=x.os=='mine',ma=mine?amt*meFrac(x):0,q=take(lots,c,ma,'ex:'+c);r.over=q.over;   // Other Payer: 환율은 내 환전 환율로 자동, '내 외화로 지급'만 내 몫을 환전 외화에서 차감
   const fb=last['ex:'+c]||avgRate(t,c);let rt=avgRate(t,c);if(mine&&!avg&&ma>0)rt=(q.krw+q.over*fb)/ma;
   let k=amt*rt;if(+x.rate){k=amt*x.rate;r.manual=true}r.krw=k;r.rate=amt?k/amt:0;return}
  const cash=x.pay=='cash',key=(cash?'wd:':'ex:')+c,q=take(cash?wd:lots,c,amt,key);r.over=q.over;
  const fb=last[key]||(cash?last['ex:'+c]:0)||avgRate(t,c);
  let k=q.krw+q.over*fb;if(avg)k=amt*avgRate(t,c);
  if(+x.rate){k=amt*x.rate;r.manual=true}
  r.krw=k;r.rate=amt?k/amt:0;
  if(x.pay=='atm')(wd[c]=wd[c]||[]).push({left:amt,rate:r.rate});
 });return by}
function expKrw(t,x){const b=calcAll(t)[x.id];return b?b.krw:0}

/* ============================================================

async function rcStampPrep(t){const h=hashStr(String(t.id)),v=h%6,color=STAMP_COLORS[(h>>3)%STAMP_COLORS.length],rot=(h%9)-4;

return{img:await rcImgFrom(url),txs,color,rot,sw,sc,sh:vb[3]*sc}}catch(e){return null}}
function rcStampDraw(g,S,cx,top){g.save();g.translate(cx,top+S.sh/2);g.rotate(S.rot*Math.PI/180);g.drawImage(S.img,-S.sw/2,-S.sh/2,S.sw,S.sh);
g.translate(-S.sw/2,-S.sh/2);g.scale(S.sc,S.sc);g.fillStyle=S.color;g.textBaseline='alphabetic';
S.txs.forEach(o=>{g.font=`${o.b} ${o.z}px ${o.f}`;g.textAlign=o.a=='middle'?'center':o.a=='end'?'end':'start';if('letterSpacing' in g)g.letterSpacing=(o.ls||0)+'px';

await Promise.all([document.fonts.load('700 32px Gaegu',all),document.fonts.load('40px "Darumadrop One"',t.city),document.fonts.load('40px Dokdo',t.city)]);const im=await rcLoad(C.img),S=await rcStampPrep(t);
const by=calcAll(t),sl=settle(t),cap=Math.floor((1040-C.rowY)/RC.rowH)+1,ex=Math.max(0,its.length-cap)*RC.rowH,ex2=S?Math.max(0,Math.round(RC.stampY+S.sh+30-1425)):0,W=1024,H=1536+ex+ex2;
