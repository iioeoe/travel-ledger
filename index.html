<script>
/* ============ 계산 로직 (CALC-START) ============ */
const BIG=['JPY','VND','IDR','KHR','LAK','MMK','MNT','KZT','COP','CLP','TZS'];            // 100단위당 환율로 보여줄 통화
const CATS=['항공','숙박','식비','교통','쇼핑','입장료','기타'];
const CURS=['USD','JPY','EUR','CNY','THB','VND','TWD','HKD','SGD','GBP','AUD'];
const CNAME={USD:'미국',JPY:'일본',EUR:'유럽',CNY:'중국',THB:'태국',VND:'베트남',TWD:'대만',HKD:'홍콩',SGD:'싱가포르',GBP:'영국',AUD:'호주'};
const PAYN={cash:'현금',tlog:'카드(트래블로그)',twallet:'카드(트래블월렛)',atm:'ATM기',krw:'원화',card:'카드'};
const isWd=x=>x.pay=='atm';   // ATM 인출 = 지출이 아니라 "현금 만들기" → 총 지출·분류·정산에서 제외
function avgRate(t,c){let k=0,f=0;t.exchanges.forEach(e=>{if(e.cur==c){k+=+e.krw;f+=+e.fx}});return f?k/f:0}
/* ★ 환율 자동 적용 (여행마다 t.rateMode: 'fifo'=환전 순서대로 / 'avg'=평균 환율)
   · 카드(트래블로그·월렛)·ATM 인출 → "환전한 외화"에서 순서대로 차감, 그 환전분의 환율 적용 (두 환전에 걸치면 구간별로 계산해 합산)
   · ATM으로 뽑은 금액은 "현금 주머니"가 되고, 현금 지출은 이 주머니에서 순서대로 차감, 인출 때의 환율 적용
   · 환율 직접 입력 지출도 순서(차감)에는 똑같이 포함 / 원화 지출은 그대로 */
const sortKey=e=>String(e.date)+' '+(e.time||(e.pay=='atm'?'00:00':'99:99'));   // 시간 없으면 그날 맨 뒤 (단, ATM 인출은 그날 맨 앞)
function calcAll(t){
 const avg=t.rateMode=='avg',by={},lots={},wd={},last={},cmp=(a,b)=>sortKey(a[0]).localeCompare(sortKey(b[0]))||a[1]-b[1];
 t.exchanges.map((e,i)=>[e,i]).sort(cmp).forEach(([e])=>{(lots[e.cur]=lots[e.cur]||[]).push({left:+e.fx,rate:e.krw/e.fx})});
 const take=(pool,c,amt,key)=>{const L=pool[c]||[];let need=amt,krw=0;while(need>1e-9&&L.length){const l=L[0],u=Math.min(l.left,need);krw+=u*l.rate;l.left-=u;need-=u;last[key]=l.rate;if(l.left<=1e-9)L.shift()}return{krw,over:need>1e-9?need:0}};
 t.expenses.map((x,i)=>[x,i]).sort(cmp).forEach(([x])=>{
  const amt=+x.amt,c=x.cur,r={krw:0,rate:0,over:0,manual:false};by[x.id]=r;
  if(x.pay=='krw'||c=='KRW'){r.krw=amt;return}
  if(x.pay=='card'){r.krw=+x.krw||0;r.rate=amt?r.krw/amt:0;return}
  const cash=x.pay=='cash',key=(cash?'wd:':'ex:')+c,q=take(cash?wd:lots,c,amt,key);r.over=q.over;
  const fb=last[key]||(cash?last['ex:'+c]:0)||avgRate(t,c);
  let k=q.krw+q.over*fb;if(avg)k=amt*avgRate(t,c);
  if(+x.rate){k=amt*x.rate;r.manual=true}
  r.krw=k;r.rate=amt?k/amt:0;
  if(x.pay=='atm')(wd[c]=wd[c]||[]).push({left:amt,rate:r.rate});
 });return by}
function expKrw(t,x){const b=calcAll(t)[x.id];return b?b.krw:0}
// 사람별 부담액 (균등, 마지막 사람이 나머지 흡수 / 직접 입력이면 그대로)
function shares(t,x,k){if(x.custom)return{...x.custom};const s=x.split&&x.split.length?x.split:[x.payer],n=s.length,r={};let a=0;s.forEach((p,i)=>{const v=i<n-1?Math.round(k/n):k-a;r[p]=v;a+=v});return r}
// 남은 외화 = 환전 − (카드+ATM 인출) / 남은 현금 = ATM 인출 − 현금 지출
function remain(t){const ex={},cash={};t.exchanges.forEach(e=>ex[e.cur]=(ex[e.cur]||0)+ +e.fx);
t.expenses.forEach(x=>{const c=x.cur,a=+x.amt;if(x.pay=='tlog'||x.pay=='twallet'||x.pay=='atm')ex[c]=(ex[c]||0)-a;if(x.pay=='atm')cash[c]=(cash[c]||0)+a;if(x.pay=='cash')cash[c]=(cash[c]||0)-a});return{ex,cash}}
// 정산: 잔액 = 낸 금액 − 부담액, 큰 채권자↔큰 채무자 순으로 맞춰 송금 횟수 최소화 (ATM 인출은 제외)
function settle(t){const by=calcAll(t),paid={},owed={};t.people.forEach(p=>paid[p]=owed[p]=0);
t.expenses.filter(x=>!isWd(x)).forEach(x=>{const k=Math.round(by[x.id].krw),sh=shares(t,x,k);paid[x.payer]=(paid[x.payer]||0)+k;for(const p in sh)owed[p]=(owed[p]||0)+sh[p]});
const bal={};[...new Set([...Object.keys(paid),...Object.keys(owed)])].forEach(p=>bal[p]=Math.round((paid[p]||0)-(owed[p]||0)));
const cr=[],db=[];for(const p in bal){if(bal[p]>0)cr.push([p,bal[p]]);else if(bal[p]<0)db.push([p,-bal[p]])}
cr.sort((a,b)=>b[1]-a[1]);db.sort((a,b)=>b[1]-a[1]);const tr=[];let i=0,j=0;
while(i<cr.length&&j<db.length){const m=Math.min(cr[i][1],db[j][1]);if(m>0)tr.push({from:db[j][0],to:cr[i][0],amt:m});cr[i][1]-=m;db[j][1]-=m;if(!cr[i][1])i++;if(!db[j][1])j++}
return{bal,paid,owed,tr}}
/* ============ (CALC-END) ============ */
/* ============================================================
  [E] 나라 데이터 + 영문 나라 이름 (TRAVEL LEDGER KIT 그대로)
============================================================ */
const COUNTRIES = [
{code:"KOR",ko:"대한민국",cont:"아시아",lat:35.9,lng:127.8},
{code:"JPN",ko:"일본",cont:"아시아",lat:36.2,lng:138.3},
{code:"CHN",ko:"중국",cont:"아시아",lat:35.0,lng:105.0},
{code:"TWN",ko:"대만",cont:"아시아",lat:23.7,lng:121.0},
{code:"HKG",ko:"홍콩",cont:"아시아",lat:22.3,lng:114.2},

function stampDate(t,fmt){
  const d=parseFullDate(t.start);
  if(!d){
    const m=String(t.start||"").match(/^(\d{4})(?:-(\d{2}))?/);
    if(!m)return "";
    return m[2]?MON3[+m[2]-1]+" "+m[1]:m[1];
  }
  const dd=String(d.getDate()).padStart(2,"0"),mm=String(d.getMonth()+1).padStart(2,"0"),y=d.getFullYear();
  if(fmt==="dot")return dd+"."+mm+"."+y;
  if(fmt==="slash")return dd+"/"+mm+"/"+String(y).slice(-2);
  if(fmt==="long")return dd+" "+MONL[d.getMonth()]+" "+y;
  return dd+" "+MON3[d.getMonth()]+" "+y;
}
function geoDigits(t){
  const ci=countryInfo(t.countryCode);
  const lat=t.lat!=null?t.lat:(ci?ci.lat:null),lng=t.lng!=null?t.lng:(ci?ci.lng:null);
  if(lat==null||lng==null)return null;
  const d=n=>Math.abs(n).toFixed(4).replace(".","");
  return [d(lat),d(lng)];
}
function cityInitials(name){
  const n=String(name||"").trim();
  if(!/^[A-Za-z][A-Za-z .'-]*$/.test(n))return "";
  const w=n.split(/[\s.-]+/).filter(Boolean);
  return (w.length>1?w.map(x=>x[0]).join(""):n.slice(0,3)).toUpperCase().slice(0,4);
}
function sxT(txt,x,y,size,o){
  o=o||{};
  const str=String(txt||"");
  if(!str)return "";
  let w=0;
  const cw=o.w||(o.f===F_SLAB?0.62:(o.f===F_TYPE?0.6:0.5));
  for(const ch of str)w+=ch.charCodeAt(0)>255?1:cw;
  const fit=o.max&&w*size>o.max?` textLength="${o.max}" lengthAdjust="spacingAndGlyphs"`:"";
  return `<text x="${x}" y="${y}" font-size="${size}" text-anchor="${o.a||"middle"}" font-family="${o.f||F_COND}" font-weight="${o.b?700:400}" fill="currentColor" stroke="none"${o.ls?` letter-spacing="${o.ls}"`:""}${fit}>${escapeHtml(str)}</text>`;
}

function renderStampList(trips,openFn){
  return '<div class="stamp-grid">'+trips.map(t=>{
    const ci=countryInfo(t.countryCode);
    const h=hashStr(String(t.id));
    const v=h%6,color=STAMP_COLORS[(h>>3)%STAMP_COLORS.length],rot=(h%9)-4;
    const country=ci?ci.ko:t.countryCode;
    const wide=[0,3,4,5].includes(v);

  }).join("")+'</div>';
}

async function push(){if(!cfg.key)return;setSt('업로드 중…');try{const H={'Content-Type':'application/json','X-Master-Key':cfg.key},b=JSON.stringify(S);let r;
if(!cfg.bin){r=await fetch('https://api.jsonbin.io/v3/b',{method:'POST',headers:{...H,'X-Bin-Private':'true','X-Bin-Name':'trip-cost'},body:b});if(!r.ok)throw 0;cfg.bin=(await r.json()).metadata.id;saveCfg()}
else{r=await fetch('https://api.jsonbin.io/v3/b/'+cfg.bin,{method:'PUT',headers:H,body:b});if(!r.ok)throw 0}
setSt('동기화됨 '+new Date().toLocaleTimeString('ko-KR'))}catch(e){setSt('동기화 실패 (Key/Bin ID 확인)')}}
async function pull(){if(!cfg.key||!cfg.bin)return;setSt('불러오는 중…');try{const r=await fetch('https://api.jsonbin.io/v3/b/'+cfg.bin+'/latest',{headers:{'X-Master-Key':cfg.key}});if(!r.ok)throw 0;const d=(await r.json()).record;
if(d&&d.trips&&d.ts>S.ts){S=d;fixTrips();localStorage.setItem('tripcost',JSON.stringify(S));render();setSt('불러옴')}else if(S.ts>(d&&d.ts||0))push();else setSt('최신 상태')}catch(e){setSt('불러오기 실패')}}

let okFn=null,delFn=null;
function openSheet(title,body,ok,del){okFn=ok;delFn=del;$('#bx').innerHTML=`<h3>${title}</h3>${body}<div class=btns>${del?'<button class=del onclick="delFn();closeSheet()">삭제</button>':''}<button onclick=closeSheet()>취소</button><button class=ok onclick="if(okFn()!==false)closeSheet()">저장</button></div>`;$('#sh').classList.add('on');history.pushState({v:'sheet'},'')}
function closeSheet(){$('#sh').classList.remove('on');if(history.state&&history.state.v=='sheet')history.back()}
$('#sh').addEventListener('click',e=>{if(e.target.id=='sh')closeSheet()});
function curSel(id,v,cb){const c=CURS.includes(v);return `<label>통화<select id=${id} onchange="curChg('${id}');${cb||''}">${CURS.map(x=>`<option value=${x} ${x==v?'selected':''}>${CNAME[x]} ${x}</option>`).join('')}<option value=__ ${c?'':'selected'}>직접 입력</option></select><input id=${id}_o placeholder="예: CAD" style="display:${c?'none':'block'}" value="${c?'':esc(v)}" oninput="${cb||''}"></label>`}
const curChg=id=>$('#'+id+'_o').style.display=val(id)=='__'?'block':'none';
const getCur=id=>val(id)=='__'?val(id+'_o').trim().toUpperCase():val(id);

/* ---------- 날짜 입력 (연 4자리 → 월 → 일 자동 이동) ---------- */
function dateIn(id,v){const[a,b,c]=(v||'').split('-');return `<div class=dt id=${id}><input data-k=y inputmode=numeric maxlength=4 placeholder=연도 value="${a||''}" oninput="dtAdv(this,4)" onfocus=this.select()><span>-</span><input data-k=m inputmode=numeric maxlength=2 placeholder=월 value="${b||''}" oninput="dtAdv(this,2)" onfocus=this.select()><span>-</span><input data-k=d inputmode=numeric maxlength=2 placeholder=일 value="${c||''}" oninput="dtAdv(this,2)" onfocus=this.select()></div>`}
function dtAdv(el,len){let v=el.value.replace(/\D/g,''),k=el.dataset.k;if(k=='m'&&v.length==1&&+v>1)v='0'+v;if(k=='d'&&v.length==1&&+v>3)v='0'+v;if(k=='h'&&v.length==1&&+v>2)v='0'+v;if(k=='n'&&v.length==1&&+v>5)v='0'+v;el.value=v;
if(v.length>=len){const nx=el.parentNode.querySelector('[data-k='+({y:'m',m:'d',h:'n'}[k]||'x')+']');if(nx){nx.focus();nx.select()}}if($('#f_pay'))xPrev()}
function dateVal(id){const g=k=>$('#'+id+' [data-k='+k+']').value,y=g('y'),m=g('m'),d=g('d');if(y.length!=4||!+m||!+d)return'';const t=new Date(+y,m-1,+d);if(t.getMonth()!=m-1||t.getDate()!=+d)return'';return y+'-'+m.padStart(2,'0')+'-'+d.padStart(2,'0')}

function timeIn(id,v){const[a,b]=(v||'').split(':');return `<div class=dt id=${id}><input data-k=h inputmode=numeric maxlength=2 placeholder=시 value="${a||''}" oninput="dtAdv(this,2)" onfocus=this.select()><span>:</span><input data-k=n inputmode=numeric maxlength=2 placeholder=분 value="${b||''}" oninput="dtAdv(this,2)" onfocus=this.select()></div>`}
function timeVal(id){const g=k=>$('#'+id+' [data-k='+k+']').value,h=g('h'),n=g('n');if(!h&&!n)return'';if(!h||+h>23||(n&&+n>59))return null;return h.padStart(2,'0')+':'+(n||'0').padStart(2,'0')}

function drawChart(t){const e=$('#cv');if(!e)return;const d=CATS.map(c=>t.expenses.filter(x=>x.cat==c).reduce((a,x)=>a+Math.round(expKrw(t,x)),0));
chart=new Chart(e,{type:'doughnut',data:{labels:CATS,datasets:[{data:d,backgroundColor:PAL,borderWidth:2,borderColor:'#fff'}]},options:{cutout:'62%',plugins:{legend:{display:false}}}})}
function vEx(t){const cs=[...new Set(t.exchanges.map(e=>e.cur))];
return `${balCard(t)}<div class=card><h3>통화별 평균 환율</h3>${cs.length?cs.map(c=>`<div class=row><div>${c}</div><div class="num gold">${rs(c,avgRate(t,c))}</div></div>`).join(''):'<div class=sub>환전을 추가하면 평균 환율이 계산돼요</div>'}</div>
<div class=card><h3>환전 기록</h3>${t.exchanges.length?byDate(t.exchanges).map(e=>`<div class=row onclick="exForm('${e.id}')"><div><div>${e.date.slice(5)}${e.time?' '+e.time:''} · ${esc(e.cur)}</div><div class=sub>${rs(e.cur,e.krw/e.fx)}</div></div><div class="r num"><div>${won(e.krw)}</div><div>→ ${num(e.fx)} ${esc(e.cur)}</div></div></div>`).join(''):'<div class=empty>아직 기록이 없어요</div>'}</div>`}
function vXp(t){const by=calcAll(t);return `${balCard(t)}<div class=card><h3>지출 기록</h3>${t.expenses.length?byDate(t.expenses).map(x=>{const b=by[x.id],k=Math.round(b.krw),f=x.pay!='krw'&&x.cur!='KRW',w=isWd(x);
return `<div class=row onclick="xForm('${x.id}')" ${w?'style="opacity:.75"':''}><div><div><span class=tag>${w?'인출':x.cat}</span>${esc(x.memo)||'-'}</div><div class=sub>${x.date.slice(5)}${x.time?' '+x.time:''} · ${PAYN[x.pay]}${w?'':' · '+esc(dn(x.payer))}</div></div><div class="r num"><div>${won(k)}</div>${f?`<div>${num(x.amt)} ${esc(x.cur)}</div><div class=sub>${rs(x.cur,b.rate)}${b.manual?' (직접)':''}${b.over>0?(x.pay=='cash'?' ⚠인출 현금 부족':' ⚠환전 외화 부족'):''}</div>`:''}${w?'<div class=sub>지출 합계에는 미포함</div>':''}</div></div>`}).join(''):'<div class=empty>아직 기록이 없어요</div>'}</div>`}
function vSet(t){const s=settle(t);
return `<div class=card><h3>송금 안내</h3>${s.tr.length?s.tr.map(a=>`<div class=row><div>${esc(dn(a.from))} → ${esc(dn(a.to))}</div><div class="num gold">${won(a.amt)}</div></div>`).join(''):'<div class=sub>정산할 금액이 없어요 🎉</div>'}</div>
<div class=card><h3>사람별</h3>${Object.keys(s.bal).map(p=>`<div class=row><div>${esc(dn(p))}<div class=sub>낸 돈 ${won(s.paid[p]||0)} · 부담 ${won(s.owed[p]||0)}</div></div><div class="num ${s.bal[p]>0?'pos':s.bal[p]<0?'neg':''}">${s.bal[p]>0?'+':''}${won(s.bal[p])}</div></div>`).join('')}<div class=sub style="margin-top:8px">+ 받을 돈 / − 보낼 돈</div></div>`}
fixTrips();$('#syncBtn').onclick=cfgForm;
history.replaceState({v:'list'},'');
addEventListener('popstate',e=>{const pv=view;$('#sh').classList.remove('on');view=e.state&&e.state.v=='detail'?'detail':'list';render();if(pv!=view)scrollTo(0,0)});
render();pull();
</script></body></html>
